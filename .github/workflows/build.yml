name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS application (Apple Silicon)
    # Standard macos-26 runners are arm64, not universal/Intel builders.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Show toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Test release and update metadata
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s app/tools -p 'test_*.py'
      - name: Build and verify application bundle
        working-directory: app
        run: |
          tools/make-app.sh
          test "$(lipo -archs build/Tursora.app/Contents/MacOS/Tursora)" = arm64
          codesign --verify --deep --strict build/Tursora.app
          plutil -lint build/Tursora.app/Contents/Info.plist
          test -s build/Tursora.app/Contents/Resources/AppIcon.icns
          tools/make-dmg.sh
          cd dist
          shasum -a 256 Tursora-*-macOS-arm64.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Tursora-macOS-arm64-${{ github.sha }}
          path: |
            app/dist/Tursora-*-macOS-arm64.dmg
            app/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

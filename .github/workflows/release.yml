name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (for example 0.1.0 or 0.2.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: Mark as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release (Apple Silicon)
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate version and require a new tag
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected a version such as 0.1.0 or 0.2.0-beta.1' >&2
            exit 1
          fi
          if [[ "$VERSION" == *-* && "$PRERELEASE" != true ]]; then
            echo 'Versions with a suffix must be marked as prereleases.' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists; releases are never overwritten." >&2
            exit 1
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s app/tools -p 'test_*.py'
          python3 app/tools/release-notes.py "$VERSION" \
            --changelog CHANGELOG.md --output "$RUNNER_TEMP/tursora-release-notes.md" \
            --repository "$GH_REPO" --ref "$GITHUB_SHA"
      - name: Require signing key and increasing stable version
        if: inputs.prerelease == false
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'SPARKLE_PRIVATE_KEY is not configured.' >&2; exit 1; }
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/tursora-latest-release.json"
          previous=()
          if python3 -c 'import json,sys; sys.exit(not any(a["name"] == "appcast.xml" for a in json.load(open(sys.argv[1]))["assets"]))' "$RUNNER_TEMP/tursora-latest-release.json"; then
            latest_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag_name"])' "$RUNNER_TEMP/tursora-latest-release.json")"
            gh release download "$latest_tag" --pattern appcast.xml --dir "$RUNNER_TEMP/tursora-current-feed"
            previous=(--previous-appcast "$RUNNER_TEMP/tursora-current-feed/appcast.xml")
          fi
          python3 app/tools/update-metadata.py stable-release \
            --version "$VERSION" --build "$(git show -s --format=%ct HEAD)" \
            --latest-release "$RUNNER_TEMP/tursora-latest-release.json" "${previous[@]}"
      - name: Build and verify application bundle
        working-directory: app
        shell: bash
        run: |
          TURSORA_VERSION="${VERSION%%-*}" tools/make-app.sh
          test "$(lipo -archs build/Tursora.app/Contents/MacOS/Tursora)" = arm64
          codesign --verify --deep --strict build/Tursora.app
          plutil -lint build/Tursora.app/Contents/Info.plist
          test -s build/Tursora.app/Contents/Resources/AppIcon.icns
          tools/make-dmg.sh "$VERSION"
      - name: Sign and verify stable update appcast
        if: inputs.prerelease == false
        working-directory: app
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: tools/make-appcast.sh "$VERSION" "$RUNNER_TEMP/tursora-release-notes.md"
      - name: Checksum release assets
        working-directory: app
        shell: bash
        run: |
          cd dist
          assets=("Tursora-$VERSION-macOS-arm64.dmg")
          if [[ "$PRERELEASE" != true ]]; then assets+=(appcast.xml); fi
          shasum -a 256 "${assets[@]}" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Tursora-release-${{ inputs.version }}
          path: |
            app/dist/Tursora-${{ inputs.version }}-macOS-arm64.dmg
            app/dist/SHA256SUMS.txt
            app/dist/appcast.xml
          if-no-files-found: error
      - name: Publish release from this exact commit
        shell: bash
        run: |
          # Creating a ref is atomic: fail if another actor created this tag
          # during the build, rather than publishing against an unrelated SHA.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"
          flags=(--latest)
          if [[ "$PRERELEASE" == true ]]; then flags=(--prerelease --latest=false); fi
          assets=("app/dist/Tursora-$VERSION-macOS-arm64.dmg" app/dist/SHA256SUMS.txt)
          if [[ "$PRERELEASE" != true ]]; then assets+=(app/dist/appcast.xml); fi
          gh release create "v$VERSION" "${assets[@]}" \
            --verify-tag \
            --title "Tursora $VERSION" \
            --notes-file "$RUNNER_TEMP/tursora-release-notes.md" \
            "${flags[@]}"
